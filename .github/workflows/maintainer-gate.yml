name: Maintainer Gate

# Managed by aidevops framework.
permissions:
  pull-requests: write
  issues: write
  contents: read
  statuses: write
  actions: write

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  issues:
    types: [unlabeled, labeled, assigned, unassigned]

jobs:
  gate:
    uses: marcusquinn/aidevops/.github/workflows/maintainer-gate-reusable.yml@main
    secrets: inherit
